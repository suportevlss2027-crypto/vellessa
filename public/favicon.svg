<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181716" />
      <stop offset="50%" stop-color="#121110" />
      <stop offset="100%" stop-color="#0a0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C99742" />
      <stop offset="45%" stop-color="#F3E19B" />
      <stop offset="70%" stop-color="#D4A753" />
      <stop offset="100%" stop-color="#AA7B30" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E19B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C99742" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#AA7B30" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Fundo Obsidian Escuro Circular -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Anel Externo Hairline de Ouro -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="url(#ringGrad)" stroke-width="6" />

  <!-- Selo Central em Ouro Polido -->
  <circle cx="256" cy="256" r="216" fill="url(#goldGrad)" />

  <!-- Anel Interno Fino de Precisão -->
  <circle cx="256" cy="256" r="202" fill="none" stroke="#121110" stroke-opacity="0.25" stroke-width="4" />

  <!-- Monograma "V" Serifado de Alta Joalheria -->
  <text 
    x="256" 
    y="336" 
    font-family="'Playfair Display', Georgia, 'Times New Roman', serif" 
    font-size="240" 
    font-weight="700" 
    font-style="italic" 
    text-anchor="middle" 
    fill="#121110" 
    letter-spacing="-0.02em"
  >V</text>
</svg>
